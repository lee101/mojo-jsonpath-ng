[project]
name = "mojo-jsonpath-ng"
version = "0.1.0"
description = "JSONPath evaluation accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["jsonpath", "json", "mojo", "ffi"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "jsonpath-ng==1.8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
